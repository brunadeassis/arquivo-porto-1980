<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo Confidencial - Caso Camarate</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; background-color: #e5ddc9; }
        #map { width: 100vw; height: 100vh; }
        .leaflet-tile-pane { filter: sepia(40%) contrast(110%) brightness(95%); }

        .title-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: #f1e4c3; border: 2px solid #8b0000;
            padding: 12px 25px; text-align: center; font-family: "Courier New", Courier, monospace;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.4); border-radius: 3px;
            user-select: none; cursor: pointer; width: max-content; max-width: 85vw;
        }
        .title-box h1 { margin: 0; font-size: 18px; color: #8b0000; letter-spacing: 2px; font-weight: bold; text-transform: uppercase; }
        .title-box p { margin: 5px 0 0 0; font-size: 12px; color: #222; font-weight: bold; }

        /* BOTÃO DE ATIVAÇÃO / ESTADO DO GPS */
        .gps-btn {
            position: absolute; bottom: 25px; right: 15px; z-index: 1000;
            background: #f1e4c3; border: 2px solid #8b0000; color: #8b0000;
            padding: 10px 14px; font-family: "Courier New", Courier, monospace;
            font-weight: bold; font-size: 12px; border-radius: 4px;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.4); cursor: pointer;
        }
        .gps-btn.ativo {
            background: #2b3a27; border-color: #fff; color: #fff;
        }

        /* ÍCONES DO MAPA */
        .custom-icon { background-color: #111; color: #fff; border-radius: 50%; border: 2px solid #fff; text-align: center; line-height: 24px; font-weight: bold; font-family: "Courier New", Courier, monospace; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); font-size: 14px; }
        .riot-icon { background-color: #8b0000; border: 1px solid #111; border-radius: 50%; box-shadow: 1px 1px 4px rgba(0,0,0,0.6); }
        
        /* ÍCONE DA CASA-FORTE (Quartel-General) */
        .qg-icon {
            background-color: #2b3a27; color: #fff; border-radius: 4px; border: 2px solid #fff;
            text-align: center; line-height: 24px; font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5); font-size: 18px;
        }

        /* ÍCONE DE PONTOS TURÍSTICOS */
        .tourist-icon { background-color: #555; border: 2px solid #fff; border-radius: 50%; box-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

        .gps-container { background: transparent; border: none; }
        .gps-marker { width: 16px; height: 16px; background-color: #0055ff; border-radius: 50%; border: 2px solid #fff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 85, 255, 0.7); } 70% { transform: scale(1.5); box-shadow: 0 0 0 15px rgba(0, 85, 255, 0); } 100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 85, 255, 0); } }
    </style>
</head>
<body>

    <div class="title-box" id="header-box">
        <h1>Arquivo Confidencial</h1>
        <p>Caso Camarate (Nov. / Dez. 1980)</p>
    </div>

    <button class="gps-btn" id="btn-gps">📡 ATIVAR RADAR GPS</button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        var map = L.map('map').setView([41.148, -8.615], 14);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18, attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        function createIcon(letter) { return L.divIcon({ className: 'custom-icon', html: letter, iconSize: [28, 28], iconAnchor: [14, 14] }); }
        var riotIcon = L.divIcon({ className: 'riot-icon', iconSize: [12, 12], iconAnchor: [6, 6] });
        var touristIcon = L.divIcon({ className: 'tourist-icon', iconSize: [12, 12], iconAnchor: [6, 6] });
        var gpsIcon = L.divIcon({ className: 'gps-container', html: '<div class="gps-marker"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });

        var RAIO_DESBLOQUEIO = 80;
        var desbloqueados = JSON.parse(localStorage.getItem('camarate_desbloqueados') || '{}');

        var pontosMissao = [
            { id: 'A', lat: 41.250175, lng: -8.681755, popup: '<b>A - Ponto de Infiltração</b><br>Aeroporto Francisco Sá Carneiro.', visivel: false, marker: null },
            { id: 'B', lat: 41.14908, lng: -8.60613, apenasTriangulacao: true, popup: '<b>B - Ponto de Encontro</b><br>Mercado do Bolhão (Sinal Triangulado).', visivel: false, marker: null },
            { id: 'C', lat: 41.149986, lng: -8.605621, popup: '<b>C - Onde as Almas Repousam</b><br>Capela de Santa Catarina (Capela das Almas).<br><br><b>🎙️ Escuta Intercetada:</b><br><audio controls preload="metadata" style="width: 220px; height: 36px; margin-top: 6px;"><source src="audio_eanes.mp3" type="audio/mpeg">O teu navegador não suporta áudio.</audio>', visivel: false, marker: null },
            { id: 'D', lat: 41.148589, lng: -8.625470, popup: '<b>D - O Miradouro sobre o Rio</b><br>Jardins do Palácio de Cristal (Vista do Douro).', visivel: false, marker: null },
            { id: 'E', lat: 41.145567, lng: -8.628658, popup: '<b>E - A Carruagem sobre Carris</b><br>Paragem Entre-Quintas (Linha 18 rumo ao Passeio Alegre).', visivel: false, marker: null },
            { id: 'F', lat: 41.147005, lng: -8.676114, popup: '<b>F - O Arquivo Final</b><br>Farolim da Barra do Douro. Onde o rio entrega os seus segredos.', visivel: false, marker: null }
        ];

        function revelarPonto(ponto, notificar, centralizar) {
            if (ponto.visivel) return;
            ponto.visivel = true;
            desbloqueados[ponto.id] = true;
            localStorage.setItem('camarate_desbloqueados', JSON.stringify(desbloqueados));

            ponto.marker = L.marker([ponto.lat, ponto.lng], {icon: createIcon(ponto.id)}).addTo(map).bindPopup(ponto.popup);
            if (centralizar) map.setView([ponto.lat, ponto.lng], 16);
            if (notificar) {
                ponto.marker.openPopup();
		feedbackMissao('sucesso');
            }
        }

        function esconderTodosPontos() {
            desbloqueados = {};
            localStorage.removeItem('camarate_desbloqueados');
            pontosMissao.forEach(function(p) {
                if (p.visivel) {
                    if (p.marker) { map.removeLayer(p.marker); p.marker = null; }
                    p.visivel = false;
                }
            });
            map.setView([41.148, -8.615], 14);
        }

        pontosMissao.forEach(function(p) {
            if (desbloqueados[p.id]) revelarPonto(p, false, false);
        });

        // CONTINGÊNCIA PROGRESSIVA (5 cliques no título)
        var cliquesTitulo = 0;
        var timerCliques = null;
        document.getElementById('header-box').addEventListener('click', function() {
            cliquesTitulo++;
            clearTimeout(timerCliques);
            timerCliques = setTimeout(function() { cliquesTitulo = 0; }, 1500);
            if (cliquesTitulo >= 5) {
                cliquesTitulo = 0;
                var proximoOculto = pontosMissao.find(function(p) { return !p.visivel; });
                if (proximoOculto) {
                    revelarPonto(proximoOculto, true, true);
                    alert("CONTINGÊNCIA ATIVADA: Coordenada (" + proximoOculto.id + ") desbloqueada no mapa.");
                } else {
                    esconderTodosPontos();
                    alert("MODO DE MISSÃO REINICIADO: Todas as coordenadas foram ocultadas novamente.");
                }
            }
        });

        // CASA-FORTE
        var qgIcon = L.divIcon({ className: 'qg-icon', html: '⌂', iconSize: [28, 28], iconAnchor: [14, 14] });
        L.marker([41.157854, -8.621646], {icon: qgIcon}).addTo(map)
         .bindPopup('<b>Casa-Forte</b><br>Estação Carolina Michaelis. Ponto de ocultação de bagagem e análise do dossiê.');

	// TRIANGULAÇÃO SEQUENCIAL (COM DETEÇÃO DE ERRO)
        var p1 = [41.1465, -8.6111]; // Praça da Liberdade (Canto Inf. Esq.)
        var p2 = [41.1511, -8.6013]; // Rua D. João IV (Canto Sup. Dir.)
        var p3 = [41.1463, -8.6046]; // Coliseu do Porto (Canto Inf. Dir.)
        var p4 = [41.1513, -8.6078]; // Rua Formosa (Canto Sup. Esq.)

        var pontosTriangulacao = [
            { id: 1, coords: p1, nome: 'Praça da Liberdade', marker: null },
            { id: 2, coords: p2, nome: 'Rua D. João IV', marker: null },
            { id: 3, coords: p3, nome: 'Coliseu do Porto', marker: null },
            { id: 4, coords: p4, nome: 'Rua Formosa', marker: null }
        ];

        var sequenciaCliques = [];
        var linhasDesenhadas = [];

        function resetarTriangulacao() {
            sequenciaCliques = [];
            linhasDesenhadas.forEach(function(linha) { map.removeLayer(linha); });
            linhasDesenhadas = [];
            pontosTriangulacao.forEach(function(pt) {
                if (pt.marker && pt.marker.getElement()) {
                    pt.marker.getElement().style.border = '1px solid #111';
                    pt.marker.getElement().style.transform = pt.marker.getElement().style.transform.replace(' scale(1.4)', '');
                }
            });
        }

        function ehParValido(a, b) {
            return (a === 1 && b === 2) || (a === 2 && b === 1) ||
                   (a === 3 && b === 4) || (a === 4 && b === 3);
        }

        function registarCliqueTriangulacao(ptObj) {
            // Ignora se clicar duas vezes seguidas no mesmo ponto ou em ponto já usado
            if (sequenciaCliques.indexOf(ptObj.id) !== -1) return;

            sequenciaCliques.push(ptObj.id);
            if (ptObj.marker && ptObj.marker.getElement()) {
                ptObj.marker.getElement().style.border = '2px solid #ffcc00';
            }

            // Verifica o 1º par (cliques 1 e 2)
            if (sequenciaCliques.length === 2) {
                var a = sequenciaCliques[0], b = sequenciaCliques[1];
                var cA = pontosTriangulacao[a - 1].coords;
                var cB = pontosTriangulacao[b - 1].coords;

                if (ehParValido(a, b)) {
                    var linha1 = L.polyline([cA, cB], { color: '#0055ff', weight: 4 }).addTo(map);
		    feedbackMissao('sucesso');
                    linhasDesenhadas.push(linha1);
                } else {
                    var linhaErro = L.polyline([cA, cB], { color: '#8b0000', weight: 3, dashArray: '6, 6' }).addTo(map);
                    linhasDesenhadas.push(linhaErro);
                    setTimeout(function() {
			feedbackMissao('erro');
                        alert("ERRO DE TRIANGULAÇÃO: Esta rota não interceta o alvo. As coordenadas foram reiniciadas.");
                        resetarTriangulacao();
                    }, 350);
                }
            }

            // Verifica o 2º par (cliques 3 e 4)
            if (sequenciaCliques.length === 4) {
                var c = sequenciaCliques[2], d = sequenciaCliques[3];
                var cC = pontosTriangulacao[c - 1].coords;
                var cD = pontosTriangulacao[d - 1].coords;

                if (ehParValido(c, d)) {
                    var linha2 = L.polyline([cC, cD], { color: '#0055ff', weight: 4 }).addTo(map);
                    linhasDesenhadas.push(linha2);
		    revelarPonto(pontosMissao[1], true, true);
		    feedbackMissao('sucesso');
                    map.setView([41.150053, -8.606848], 16);
                    setTimeout(function() {
                        alert("SINAL INTERCETADO: As rotas da Baixa cruzaram-se! O informante aguarda no Mercado do Bolhão.");
                    }, 500);
                } else {
                    var linhaErro2 = L.polyline([cC, cD], { color: '#8b0000', weight: 3, dashArray: '6, 6' }).addTo(map);
                    linhasDesenhadas.push(linhaErro2);
                    setTimeout(function() {
			feedbackMissao('erro');
                        alert("ERRO DE TRIANGULAÇÃO: O segundo vetor falhou o cruzamento. A reiniciar...");
                        resetarTriangulacao();
                    }, 350);
                }
            }
        }

        pontosTriangulacao.forEach(function(pt) {
            pt.marker = L.marker(pt.coords, {icon: riotIcon})
                .addTo(map)
                .bindPopup('<i>' + pt.nome + '.<br><b>(Coordenada Registada)</b></i>')
                .on('click', function() { registarCliqueTriangulacao(pt); });
        });

        // PONTOS TURÍSTICOS (Coordenadas conferidas com Google Maps / OpenStreetMap)
        var locaisTuristicos = [
            // Dia 1 - Sexta [27/11]
            { lat: 41.148836, lng: -8.613292, nome: "Restaurante Espécie - Rua da Picaria 84 (Almoço & Dossiê)" },
            { lat: 41.145674, lng: -8.614668, nome: "Torre dos Clérigos" },
            { lat: 41.146817, lng: -8.614872, nome: "Livraria Lello - R. das Carmelitas 144 (Evento 18h)" },
            { lat: 41.153680, lng: -8.613140, nome: "O Jardineiro - Rua do Almada 609 (Jantar)" },

            // Dia 2 - Sábado [28/11]
            { lat: 41.164990, lng: -8.598640, nome: "Oporto Confeitaria - Rua da Alegria 2112 (Café da manhã)" },
            { lat: 41.160883, lng: -8.595325, nome: "Sukyo Mahikari - R. Carlos Malheiro Dias 160" },
            { lat: 41.141377, lng: -8.615672, nome: "Palácio da Bolsa" },
            { lat: 41.140898, lng: -8.615916, nome: "Igreja de São Francisco do Porto" },
            { lat: 41.140480, lng: -8.613150, nome: "Cais da Ribeira & Cruzeiro das Pontes" },
            { lat: 41.141630, lng: -8.610420, nome: "Muralhas Fernandinas (Escadas do Caminho Novo)" },
            { lat: 41.142815, lng: -8.611131, nome: "Sé do Porto" },
            { lat: 41.145622, lng: -8.610622, nome: "Estação de São Bento & Fava Tonka" },
            { lat: 41.146111, lng: -8.606480, nome: "Igreja Paroquial de Santo Ildefonso" },
            { lat: 41.143660, lng: -8.613450, nome: "Rua das Flores" },
            { lat: 41.141610, lng: -8.615010, nome: "Mercado Ferreira Borges (Vinhos no Mercado)" },
            { lat: 41.139960, lng: -8.609470, nome: "Ponte Luís I" },

            // Dia 2 - Opção 1 (Vila Nova de Gaia)
            { lat: 41.138050, lng: -8.610380, nome: "Miradouro do Infante - R. 2 37, Gaia (Opção 1)" },
            { lat: 41.137850, lng: -8.608520, nome: "Miradouro da Serra do Pilar - Largo Aviz, Gaia (Opção 1)" },
            { lat: 41.136870, lng: -8.616210, nome: "Mercado Beira-Rio & daTerra Mercado, Gaia (Opção 1)" },
            { lat: 41.138434, lng: -8.621890, nome: "Churchill's 1982 Garden Bar - R. da Fonte Nova 5, Gaia (Opção 1)" },
            { lat: 41.136890, lng: -8.614950, nome: "Sandeman Terrace - Largo Miguel Bombarda 67, Gaia (Opção 1)" },
            { lat: 41.122160, lng: -8.606310, nome: "O Gato Comeu-te a Língua - Av. da República 1850, Gaia (Opção 1)" },

            // Dia 2 - Opção 2 (Aliados & Baixa / Boavista)
            { lat: 41.148050, lng: -8.610980, nome: "Avenida dos Aliados - Luzes de Natal 18h (Opção 2)" },
            { lat: 41.148950, lng: -8.604850, nome: "Casa Vegetariana - R. de Alexandre Braga 21 (Opção 2)" },
            { lat: 41.148750, lng: -8.614650, nome: "Pipa Velha - R. das Oliveiras 75 (Opção 2)" },
            { lat: 41.158150, lng: -8.634500, nome: "LEA - Food & Drinks - Av. da Boavista 854 (Opção 2)" },

            // Dia 3 - Domingo [29/11]
            { lat: 41.176850, lng: -8.691550, nome: "Praia de Matosinhos" },
            { lat: 41.155380, lng: -8.681120, nome: "Pérgola da Foz - Av. do Brasil 694" },
            { lat: 41.156620, lng: -8.629180, nome: "Mercado Bom Sucesso - Praça do Bom Sucesso 74 (Almoço & Compras)" }
        ];

        locaisTuristicos.forEach(function(local) {
            L.marker([local.lat, local.lng], {icon: touristIcon}).addTo(map).bindPopup('<span style="color:#555; font-weight:bold;">📍 ' + local.nome + '</span>');
        });
	
	// FEEDBACK VISUAL + SONORO COMPATÍVEL COM IPHONE (iOS)
        function feedbackMissao(tipo) {
            var box = document.getElementById('header-box');
            var corOriginal = '#8b0000';
            var fundoOriginal = '#f1e4c3';

            if (tipo === 'sucesso') {
                box.style.borderColor = '#2b7a0b';
                box.style.backgroundColor = '#d8f3dc';
            } else if (tipo === 'erro') {
                box.style.borderColor = '#ff0000';
                box.style.backgroundColor = '#ffccd5';
            }

            setTimeout(function() {
                box.style.borderColor = corOriginal;
                box.style.backgroundColor = fundoOriginal;
            }, 600);

            // Som curto sintetizado (funciona no Safari após o 1º toque no ecrã)
            try {
                var AudioCtx = window.AudioContext || window.webkitAudioContext;
                var ctx = new AudioCtx();
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (tipo === 'sucesso') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                }
            } catch (e) {}
        }	

        // SISTEMA DE GPS COM TRATAMENTO DE ERROS E BOTÃO DE TOQUE (Compatível com iOS Safari/Chrome)
        var gpsMarker = null;
        var btnGps = document.getElementById('btn-gps');
        var primeiroFix = true;

        function iniciarRadarGPS(centralizarAoEncontrar) {
            btnGps.textContent = "📡 A PROCURAR SINAL...";
            map.locate({
                setView: centralizarAoEncontrar,
                maxZoom: 16,
                watch: true,
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            });
        }

        map.on('locationfound', function(e) {
            btnGps.textContent = "🟢 GPS ATIVO";
            btnGps.classList.add('ativo');

            if (gpsMarker == null) {
                gpsMarker = L.marker(e.latlng, {icon: gpsIcon}).addTo(map);
                gpsMarker.bindPopup("<b>Inspetora</b><br>Ligação GPS Ativa.");
            } else {
                gpsMarker.setLatLng(e.latlng);
                if (gpsMarker.isPopupOpen()) gpsMarker.getPopup().setLatLng(e.latlng);
            }

            if (primeiroFix) {
                primeiroFix = false;
                map.setView(e.latlng, 16);
            }

            pontosMissao.forEach(function(p) {
                if (!p.visivel && !p.apenasTriangulacao) {
                    var distancia = e.latlng.distanceTo(L.latLng(p.lat, p.lng));
                    if (distancia <= RAIO_DESBLOQUEIO) {
                        revelarPonto(p, true, false);
                    }
                }
            });
        });

        map.on('locationerror', function(e) {
            btnGps.textContent = "⚠️ ATIVAR GPS";
            btnGps.classList.remove('ativo');
            alert("Aviso de GPS (" + e.code + "): " + e.message + "\n\nVerifica se a Localização está ativa nas Definições do telemóvel para o Safari/Chrome e toca em 'ATIVAR RADAR GPS'.");
        });

        // Tenta iniciar automaticamente e também permite disparo manual por toque (exigido pelo iOS)
        iniciarRadarGPS(false);
        btnGps.addEventListener('click', function() {
            primeiroFix = true;
            iniciarRadarGPS(true);
        });
    </script>
</body>
</html>
